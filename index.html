
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:transparent;color:#111}
.wrap{max-width:760px;margin:0 auto;padding:14px 0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{
  min-height:176px;border:1px solid #e7e7e7;border-radius:20px;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.04)
}
.icon{
  width:62px;height:78px;border-radius:10px;background:linear-gradient(180deg,#f6f7f9,#eceff3);
  border:1px solid #d9dde3;position:relative;margin-bottom:15px;box-shadow:0 4px 10px rgba(0,0,0,.05)
}
.icon:before{
  content:"";position:absolute;right:-1px;top:-1px;width:22px;height:22px;background:#fff;
  border-left:1px solid #d9dde3;border-bottom:1px solid #d9dde3;clip-path:polygon(0 0,100% 100%,0 100%)
}
.pdf{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:11px;font-weight:800;letter-spacing:.06em;color:#555}
.title{font-size:14px;font-weight:650;line-height:1.3;overflow-wrap:anywhere}
.size{margin-top:6px;font-size:12px;color:#888}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap"><div id="grid" class="grid"></div></div>
<script>
function send(type,payload={}){window.parent.postMessage({isStreamlitMessage:true,type,...payload},"*")}
function setHeight(){send("streamlit:setFrameHeight",{height:document.body.scrollHeight+4})}
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function fmt(bytes){if(bytes<1024)return bytes+" B";if(bytes<1024*1024)return(bytes/1024).toFixed(1)+" KB";return(bytes/1024/1024).toFixed(1)+" MB"}
function render(args){
 const grid=document.getElementById("grid");grid.innerHTML="";
 (args.files||[]).forEach(file=>{
   const card=document.createElement("div");card.className="card";
   card.innerHTML=`<div class="icon"><div class="pdf">PDF</div></div><div class="title">${esc(file.name)}</div><div class="size">${fmt(file.size||0)}</div>`;
   grid.appendChild(card);
 });
 requestAnimationFrame(setHeight);
}
window.addEventListener("message",e=>{if(e.data&&e.data.type==="streamlit:render")render(e.data.args||{})});
send("streamlit:componentReady",{apiVersion:1});setHeight();
</script>
</body>
</html>
